concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
name: IDD doctor health gate
on:
  pull_request:
permissions:
  contents: read
run-name: IDD doctor on PR #${{ github.event.pull_request.number }}
jobs:
  idd-doctor:
    name: idd-doctor health gate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Stages the current HEAD (detached)
        uses: actions/checkout@v7
        with:
          # Detached HEAD keeps the B1 disposable-worktree check inert —
          # this gate checks repository health, not the worktree rule.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup the pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          check-latest: true
          node-version: 22.x
      - env:
          HUSKY: 0
        name: Install the dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run idd-doctor
        run: pnpm exec idd-doctor
    timeout-minutes: 5
