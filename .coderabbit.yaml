chat:
  auto_reply: true
early_access: true
language: en
issue_enrichment:
  labeling:
    # Scope issue auto-labeling to content labels only. `roadmap`,
    # `status:*`, and `idd:ready` are intentionally omitted so CodeRabbit
    # never auto-applies them: those labels are reserved for IDD routing
    # (umbrella roadmap issues carrying the `web-toybox-roadmap-id` marker,
    # human-blocking states, and the issue-author approval signal) and are
    # managed by maintainers / IDD authoring, not by content heuristics.
    # Auto-applying `roadmap` in particular makes `discover-roadmap-graph`
    # mis-classify a normal child issue as a roadmap node and drop it from
    # the execution candidates.
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: >-
          Apply only when the issue reports a defect or incorrect behavior in
          shipped code, helper scripts, or instruction files.
      - label: enhancement
        instructions: >-
          Apply when the issue requests new behavior or a change to code,
          helper scripts, or workflow logic. Do not also apply documentation
          when the change is documentation-only.
      - label: documentation
        instructions: >-
          Apply when the issue is primarily about documentation, instruction
          files, or docs/template content. Do not also apply enhancement when
          the change is documentation-only.
      - label: question
        instructions: >-
          Apply when the issue is a question or request for information rather
          than an actionable change.
reviews:
  auto_review:
    enabled: true
  path_instructions:
    - instructions: When making a pull request to the main branch, please warn that the pre-release notation should be removed if the version is a pre-release.
      path: package.json
