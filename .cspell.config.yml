cache:
  cacheFormat: universal
  cacheLocation: node_modules/.cache/cspell/.cspell.cache
  cacheStrategy: metadata
  useCache: true
import:
  - '@kurone-kito/cspell-config'
version: '0.2'
# Terms introduced by the vendored IDD docs/instructions imported from
# github:kurone-kito/idd-skill (issue #30) — kept here rather than
# editing the vendored files or the shared cspell config package.
